server {
    listen 80;
    # nginx escucha en el puerto 80 DENTRO del contenedor.
    # El compose lo publica hacia el 4200 de tu PC.

    server_name _;
    # "_" = cualquier nombre de dominio. Es un solo sitio.

    root /usr/share/nginx/html;
    # La carpeta desde donde se sirven los archivos.
    # Ahí va a copiar el Dockerfile tu build de Angular.

    index index.html;

    # ═══════════════════════════════════════════════════════
    #   LA LINEA MAS IMPORTANTE DE ESTE ARCHIVO
    # ═══════════════════════════════════════════════════════
    location / {
        try_files $uri $uri/ /index.html;
    }
    # Se lee: "busca un archivo con ese nombre; si no existe,
    #          busca una carpeta; si tampoco, entrega index.html".
    #
    # Por que hace falta: entra alguien a localhost:4200/dashboard.
    # nginx busca un ARCHIVO llamado "dashboard" en el disco.
    # No existe. Sin esta linea, responde 404.
    #
    # Pero /dashboard no es un archivo: es una ruta que solo conoce
    # el router de Angular, que vive en JavaScript. nginx no la entiende.
    #
    # Con try_files, nginx devuelve index.html, Angular arranca,
    # lee la URL, y pinta el dashboard. El servidor no decide nada:
    # le entrega el control a Angular.
    #
    # Este es EL error clasico al desplegar una aplicacion Angular,
    # React o Vue: todo funciona navegando con clics, y al recargar
    # la pagina en cualquier ruta que no sea la raiz, 404.

    # ─── Cache de los archivos compilados ───
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # Angular nombra sus archivos con un hash del contenido:
    # main-X7K2P9Q3.js. Si el codigo cambia, cambia el nombre.
    #
    # Eso permite decirle al navegador "guardalo un ano, no preguntes
    # mas": un archivo con ese nombre exacto NUNCA va a cambiar.
    #
    # index.html queda FUERA de esta regla a proposito. Es el unico
    # archivo sin hash, y es el que apunta a los demas. Si el
    # navegador lo guardara, nunca se enteraria de que salio una
    # version nueva.
}