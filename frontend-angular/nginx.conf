server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-cache";
        # ═══ LA LINEA QUE FALTABA ═══
        # Ahora el index.html lleva una instruccion EXPLICITA.
        #
        # Y ojo con el nombre, que engaña a todo el mundo:
        # "no-cache" NO significa "no lo guardes". Significa
        # "puedes guardarlo, pero pregunta al servidor antes de usarlo".
        #
        # El navegador pregunta "¿cambio algo?", y si no cambio el
        # servidor responde 304 sin mandar el archivo otra vez.
        # Es barato, y garantiza que cada despliegue nuevo se note.
        #
        # El que prohibe guardar de verdad es "no-store", y aqui
        # seria un desperdicio: descargaria el archivo completo
        # en cada visita.
    }

    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Un año en segundos, en una sola cabecera. Antes tenia
        # "expires 1y" mas un add_header aparte, que generaban DOS
        # cabeceras Cache-Control. Funcionaba, pero una sola y
        # explicita es lo correcto.
        #
        # Esto es seguro SOLO porque Angular pone un hash en el
        # nombre de cada archivo: si el codigo cambia, el nombre
        # cambia, y el navegador lo trata como un archivo nuevo.
        # El que no tiene hash es index.html, y por eso es el unico
        # que necesita revalidarse siempre.
    }
}