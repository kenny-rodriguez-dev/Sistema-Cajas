services:

  # ═══════════════════════════════════════════════════════
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gestioncaja-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Password123!"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - datos-sqlserver:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Password123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ═══════════════════════════════════════════════════════
  backend:
    build:
      context: ./GestionCaja
      dockerfile: Backend/Dockerfile
    container_name: gestioncaja-backend
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__BaseDeDatos: "Server=sqlserver,1433;Database=GestionCaja;User Id=sa;Password=Password123!;TrustServerCertificate=True"
      Jwt__Clave: "clave-de-docker-larga-de-mas-de-32-caracteres-cambiar-en-produccion"
      Jwt__Emisor: "GestionCajaApi"
      Jwt__Audiencia: "GestionCajaFrontend"
      Jwt__MinutosDeVida: "60"
      FrontendUrl: "http://localhost:4200"
      # A donde apuntan los enlaces de recuperacion de contrasena.
      # Uno solo, decidido aqui: nunca un dato que mande el cliente.
      # Cambialo a 3000 si quieres que lleven a Next.js.
      #
      # CORS permite los dos frontends igual, porque el 4200 esta
      # escrito aparte en Program.cs.
    ports:
      - "5000:8080"

  # ═══════════════════════════════════════════════════════
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:5000"
    container_name: gestioncaja-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"

  # ═══════════════════════════════════════════════════════
  frontend-angular:
    build:
      context: ./frontend-angular
      dockerfile: Dockerfile
      # Sin "args": la URL del backend sale de environment.ts.
    container_name: gestioncaja-frontend-angular
    depends_on:
      - backend
    ports:
      - "4200:80"
      # Tu PC 4200 -> puerto 80 del contenedor, donde escucha nginx.
      # Mismo puerto que usas en desarrollo, para no confundirte.

volumes:
  datos-sqlserver: